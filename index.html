<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makita - Bem Vindo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Background animado com gradiente */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000000, #1a0000, #000000);
            background-size: 400% 400%;
            z-index: -2;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flutuando */
        .particle {
            position: fixed;
            pointer-events: none;
            opacity: 0.5;
        }

        .particle.dot {
            width: 4px;
            height: 4px;
            background: #ff0000;
            border-radius: 50%;
        }

        .particle.line {
            width: 2px;
            height: 30px;
            background: linear-gradient(180deg, #ff0000, transparent);
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .makita {
            color: #ff0000;
            font-weight: bold;
            display: inline-block;
            text-shadow: 0 0 20px #ff0000, 0 0 40px rgba(255, 0, 0, 0.5);
            filter: drop-shadow(0 0 10px #ff0000);
        }

        .letter {
            display: inline-block;
            opacity: 0;
            position: relative;
        }

        .letter:hover {
            filter: drop-shadow(0 0 15px #ff6666);
        }

        p {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 30px;
            opacity: 0;
        }

        p a {
            color: #ff0000;
            text-decoration: none;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        p a:hover {
            text-decoration: underline;
            text-shadow: 0 0 20px #ff0000;
        }

        .container {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    
    <div class="container">
        <h1>Bem Vindo a <span class="makita" id="makita"></span></h1>
        <p>Desenvolvido por <a href="https://www.instagram.com/perfildohenrique/" target="_blank">Henrique</a></p>
    </div>

    <script>
        // Criar partículas flutuando
        function createParticles() {
            const particleCount = 30;
            const body = document.body;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement("div");
                particle.className = "particle " + (Math.random() > 0.5 ? "dot" : "line");
                
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                particle.style.left = x + "px";
                particle.style.top = y + "px";
                
                body.appendChild(particle);

                // Animar partículas com GSAP
                gsap.to(particle, {
                    y: Math.random() > 0.5 ? -100 : 100,
                    x: (Math.random() - 0.5) * 100,
                    opacity: Math.random() * 0.5,
                    duration: gsap.utils.random(4, 8),
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            }
        }

        // Criar as letras no HTML
        const text = "Makita";
        const makitaElement = document.getElementById("makita");
        
        for (let char of text) {
            const letter = document.createElement("span");
            letter.className = "letter";
            letter.textContent = char;
            makitaElement.appendChild(letter);
        }

        // Timeline GSAP
        const tl = gsap.timeline();

        // Container entra com fade
        tl.to(".container", { opacity: 1, duration: 0.5 }, 0);

        // Aguarda 0.3s antes de iniciar a digitação
        tl.to({}, { duration: 0.3 }, 0.5);

        // Anima cada letra individualmente
        const letters = document.querySelectorAll(".letter");
        letters.forEach((letter, index) => {
            tl.to(letter, { 
                opacity: 1, 
                duration: 0.3,
                ease: "power2.out"
            }, 0.8 + (index * 0.3));
        });

        // Anima o parágrafo após as letras
        tl.to("p", { 
            opacity: 0.9, 
            duration: 0.5,
            ease: "power2.out"
        }, "-=0.2");

        // Interatividade com mouse - Efeito de repulsão
        document.addEventListener("mousemove", (e) => {
            letters.forEach((letter) => {
                const rect = letter.getBoundingClientRect();
                const letterX = rect.left + rect.width / 2;
                const letterY = rect.top + rect.height / 2;

                const distance = Math.hypot(e.clientX - letterX, e.clientY - letterY);
                const maxDistance = 150;

                if (distance < maxDistance) {
                    const angle = Math.atan2(letterY - e.clientY, letterX - e.clientX);
                    const force = (1 - distance / maxDistance) * 30;

                    gsap.to(letter, {
                        x: Math.cos(angle) * force,
                        y: Math.sin(angle) * force,
                        duration: 0.3,
                        overwrite: 'auto'
                    });
                } else {
                    gsap.to(letter, {
                        x: 0,
                        y: 0,
                        duration: 0.3,
                        overwrite: 'auto'
                    });
                }
            });
        });

        // Iniciar partículas
        createParticles();
    </script>
</body>
</html>
