<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makita - Bem Vindo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .makita {
            color: #ff0000;
            font-weight: bold;
        }

        .letter {
            display: inline-block;
            opacity: 0;
        }

        p {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 30px;
            opacity: 0;
        }

        p a {
            color: #ff0000;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        .container {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem Vindo a <span class="makita" id="makita"></span></h1>
        <p>Desenvolvido por <a href="https://www.instagram.com/perfildohenrique/" target="_blank">Henrique</a></p>
    </div>

    <script>
        const text = "Makita";
        const makitaElement = document.getElementById("makita");
        
        // Criar as letras no HTML
        for (let char of text) {
            const letter = document.createElement("span");
            letter.className = "letter";
            letter.textContent = char;
            makitaElement.appendChild(letter);
        }

        // Timeline GSAP
        const tl = gsap.timeline();

        // Container entra com fade
        tl.to(".container", { opacity: 1, duration: 0.5 }, 0);

        // Aguarda 0.3s antes de iniciar a digitação
        tl.to({}, { duration: 0.3 }, 0.5);

        // Anima cada letra individualmente
        const letters = document.querySelectorAll(".letter");
        letters.forEach((letter, index) => {
            tl.to(letter, { 
                opacity: 1, 
                duration: 0.3,
                ease: "power2.out"
            }, 0.8 + (index * 0.3));
        });

        // Anima o parágrafo após as letras
        tl.to("p", { 
            opacity: 0.9, 
            duration: 0.5,
            ease: "power2.out"
        }, "-=0.2");
    </script>
</body>
</html>
