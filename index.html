<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makita - Bem Vindo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            color: #ffffff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .makita {
            color: #ff0000;
            font-weight: bold;
        }

        .letter {
            display: inline-block;
            opacity: 0;
            animation: typeWriter 0.3s ease-in-out forwards;
        }

        p {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 30px;
            opacity: 0.9;
            animation: fadeIn 0.8s ease-in-out;
        }

        p a {
            color: #ff0000;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }

        /* Animação de digitação */
        @keyframes typeWriter {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Animação de entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.8s ease-in-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bem Vindo a <span class="makita" id="makita"></span></h1>
        <p>Desenvolvido por <a href="https://www.instagram.com/perfildohenrique/" target="_blank">Henrique</a></p>
    </div>

    <script>
        const text = "Makita";
        const makitaElement = document.getElementById("makita");
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                const letter = document.createElement("span");
                letter.className = "letter";
                letter.textContent = text[index];
                letter.style.animationDelay = (index * 0.3) + "s";
                makitaElement.appendChild(letter);
                index++;
                setTimeout(typeWriter, 300);
            }
        }

        setTimeout(typeWriter, 300);
    </script>
</body>
</html>
